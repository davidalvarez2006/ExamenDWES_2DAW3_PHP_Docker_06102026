<html>
    <head>
        <meta charset="UTF-8">
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informática</button>
        <button onclick="location.href='../php/tabla.php?tipo=socio'">Asistencia Sociosanitaria</button>
        <form action="../php/tabla.php" method="post">
            <!-- Añade aquí todos los datos que te pido en el enunciado -->
            <label>Nombre:</label>
            <input type="text" id="nombre" name="nombre" minlength="2" required>

            <label>Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" minlength="2" required>

            <label>DNI:</label>
            <input type="text" id="dni" name="dni" pattern="[0-9]{8}[A-Za-z]" maxlength="9" required>

            <label>Fecha de nacimiento:</label>
            <input type="date" id="f_nac" name="f_nac" required>
        
            <label>Telefono:</label>
            <input type="tel" id="tlf" name="tlf" pattern="[+]?[0-9][0-9() -]{6,18}" maxlength="20" required>

            <label>Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label>Profesion:</label>
            <select id="profesion" name="profesion" required>
                <option value="" selected disabled>Selecciona una profesión</option>
                <option value="soldadura">Soldadura</option>
                <option value="informatica">Informatica</option>
                <option value="asistencia-sociosanitaria">Asistencia sociosanitaria</option>
            </select>

            <label>Ingrese jornada:</label>
            <input type="radio" name="jornadaParcial" id="jornada-parcial" value="1" required>Jornada Parcial
            <br>
            <input type="radio" name="jornadaParcial" id="jornada-completa" value="0">Jornada Completa
            <br>

            <label>Agregue idiomas:</label>
            <input type="checkbox" name="idiomas[]" id="idioma-ingles" value="Ingles">Ingles
            <br>
            <input type="checkbox" name="idiomas[]" id="idioma-euskera" value="Euskara">Euskara    
        </form>
    </body>
</html>
